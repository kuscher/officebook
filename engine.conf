# The engine's autogen.input (android/README.md, "Build the engine"). CI fills
# in @NDK@, @SDK@ and @JOBS@. Changing this file rebuilds the engine.
#
# CPAndroidAarch64 brings CPAndroidCommon (Collabora's Android options) and
# Langs; --with-lang after it overrides Langs' 38 languages, whose
# translations live in a separate repository we don't fetch.
--with-distro=CPAndroidAarch64
--with-lang=en-US
--with-android-ndk=@NDK@
--with-android-sdk=@SDK@
--with-parallelism=@JOBS@
